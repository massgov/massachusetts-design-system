<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Core Components - Site Header</title>
    <link rel="stylesheet" href="/@massds/mds-tokens/dist/index.css" />
    <link rel="stylesheet" href="styles.css" media="all" />
  </head>
  <body>
    <div class="mds-site-header">
      <div
        class="mds-site-header__container">
        <section
          class="mds-site-header__title">
          <a class="mds-site-header__brand" href="/">
            <img
              class="mds-site-header__seal"
              src="/@massds/mds-assets/dist/state-seal/state-seal-black.png"
              alt="Massachusetts State Seal"
            />
            <span class="mds-site-header__text">
              <span class="mds-site-header__site-name">Site name</span>
              <span class="mds-site-header__organization">
                Organization info (Optional)
              </span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
