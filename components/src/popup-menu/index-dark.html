<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Core Components - Popup Menu</title>
    <link rel="stylesheet" href="/@massds/mds-tokens/dist/index-dark.css" />
    <link rel="stylesheet" href="styles.css" media="all" />
  </head>
  <body class="dark">
    <main class="mds-popup-menu__container">
      <h1>Pop-up menu (Dark mode)</h1>
      <button
        class="mds-popup-menu-trigger"
        aria-haspopup="true"
        aria-controls="popup-menu"
      >
        Open Popup Menu
      </button>
      <div id="mds-popup-menu" class="mds-popup-menu" role="menu">
        <ul>
          <li>
            <a href="#" role="menuitem">
              <span class="mds-popup-menu__label">
                <span class="mds-popup-menu__icon" aria-hidden="true"></span>
                Select item
              </span>
            </a>
          </li>
          <li>
            <a href="#" role="menuitem">
              <span class="mds-popup-menu__label">
                <span class="mds-popup-menu__icon" aria-hidden="true"></span>
                Select item
              </span>
            </a>
          </li>
          <li>
            <a href="#" role="menuitem">
              <span class="mds-popup-menu__label">
                <span class="mds-popup-menu__icon" aria-hidden="true"></span>
                Select item
              </span>
            </a>
          </li>
          <li>
            <a href="#" role="menuitem">
              <span class="mds-popup-menu__label">
                <span class="mds-popup-menu__icon" aria-hidden="true"></span>
                Select item
              </span>
            </a>
          </li>
          <li>
            <a href="#" role="menuitem">
              <span class="mds-popup-menu__label">
                <span class="mds-popup-menu__icon" aria-hidden="true"></span>
                Select item
              </span>
            </a>
          </li>
          <li>
            <a href="#" role="menuitem">
              <span class="mds-popup-menu__label">
                <span class="mds-popup-menu__icon" aria-hidden="true"></span>
                Select item
              </span>
            </a>
          </li>
        </ul>
      </div>
    </main>
    <script src="popup-menu.js"></script>
    <script>
      popupMenu.init();
    </script>
  </body>
</html>
