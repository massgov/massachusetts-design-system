<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDS Page Layout Demo</title>
    <link rel="stylesheet" href="../../../tokens/src/index.css" />
    <link rel="stylesheet" href="../../dist/helpers.css" />
    <link rel="stylesheet" href="../../dist/utilities.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="demo-grid" data-demo-grid>
      <div class="demo-grid-status" data-grid-status>Breakpoint: loading</div>
      <button type="button" class="demo-grid-toggle" data-grid-toggle aria-pressed="true">Hide grid</button>
      <div class="demo-grid__overlay" aria-hidden="true">
        <div class="mds-grid mds-section__container">
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
        </div>
      </div>

      <div class="demo-page__content">
        <header class="demo-section demo-section--state-banner">
          <div class="mds-section__container">
            <div class="demo-color-block demo-color-block--xs demo-color-block--light">
            </div>
          </div>
        </header>

        <section class="demo-section demo-section--primary-inverse">
          <div class="mds-section__container mds-padding-block-2xl">
            <h1>Responsive page layout demo</h1>
          </div>
        </section>

        <section class="demo-section demo-section--primary">
          <div class="mds-section__container mds-padding-block-sm">
            <h2>Heading level 2</h2>
            <h3>Heading level 3</h3>
            <b>Body text lg bold</b>
            <p>Body text lg</p>
          </div>
        </section>

        <section class="demo-section demo-section--secondary mds-padding-block-2xl">
          <div class="mds-section__container">
          <h2>Grid examples</h2>
          <b>Full width</b>
          <div class="mds-grid mds-margin-block-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-12"></div>
          </div>
          <b>2 columns</b>
          <div class="mds-grid mds-margin-block-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-6"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-6"></div>
          </div>
          <b>3 columns</b>
          <div class="mds-grid mds-margin-block-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-4"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-4"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-4"></div>
          </div>
          <b>4 columns</b>
          <div class="mds-grid mds-margin-block-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-3"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-3"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-3"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-span-3"></div>
          </div>
        </div>
        </section>

        <footer class="demo-footer">
          <div class="mds-section__container mds-padding-block-2xl">
            <div class="demo-color-block demo-color-block--lg demo-color-block--neutral"></div>
          </div>
        </footer>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
