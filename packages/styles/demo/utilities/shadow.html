<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDS Shadow Utilities Demo</title>
    <link rel="stylesheet" href="/@massds/mds-tokens/dist/index.css" />
    <link rel="stylesheet" href="/@massds/mds-styles/dist/index.css" />
    <link rel="stylesheet" href="/template/index.css" />
    <link rel="stylesheet" href="/utilities/index.css" />
  </head>
  <body class="mds-body">
    <main class="page-demo">
      <section class="page-demo__hero">
        <div class="mds-section-container mds-padding-block-2xl">
          <a class="page-demo__back-link" href="../index.html">← All reusable CSS</a>
          <p class="page-demo__eyebrow">Massachusetts Design System</p>
          <h1 class="mds-text-heading-2xl">Shadow Utilities</h1>
          <p class="page-demo__lede">Elevation classes generated from semantic shadow tokens.</p>
        </div>
      </section>

      <section class="page-demo__section">
        <div class="mds-section-container mds-padding-block-2xl">
          <div class="page-demo__grid page-demo__grid--cards">
            <article class="page-demo__card page-demo__card--surface mds-shadow-container"><code>.mds-shadow-container</code></article>
            <article class="page-demo__card page-demo__card--surface mds-shadow-modal"><code>.mds-shadow-modal</code></article>
            <article class="page-demo__card page-demo__card--surface mds-shadow-hover-sm"><code>.mds-shadow-hover-sm</code></article>
            <article class="page-demo__card page-demo__card--surface mds-shadow-hover-md"><code>.mds-shadow-hover-md</code></article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
