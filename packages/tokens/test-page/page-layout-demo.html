<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDS Page Layout Demo</title>
    <link rel="stylesheet" href="../src/index.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      h1 {
        font: var(--mds-text-heading-2xl);
      }

      h2 {
        font: var(--mds-text-heading-xl);
      }

      h3 {
        font: var(--mds-text-heading-lg);
      }

      p {
        font: var(--mds-text-body-lg);
      }

      b {
        font: var(--mds-text-body-lg-bold);
      }

      body {
        margin: 0;
        background: var(--mds-background-surface-default);
        color: var(--mds-text-and-icons-brand-neutral-default);
        font: var(--mds-text-body);
      }

      .demo-grid {
        position: relative;
        min-height: 100vh;
      }

      .demo-grid__overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      .demo-grid--overlay-hidden .demo-grid__overlay {
        display: none;
      }

      .demo-grid-column {
        min-height: 100%;
        background: pink;
        opacity: 0.3;
      }

      .demo-page__content {
        position: relative;
        z-index: 1;
      }

      .demo-grid-toggle {
        position: fixed;
        bottom: var(--mds-space-md);
        right: var(--mds-breakpoint-horizontal-space-margin);
        z-index: 3;
        border: 2px solid var(--mds-static-white);
        border-radius: var(--mds-radius-md);
        padding: var(--mds-space-xs);
        background: var(--mds-static-black);
        color: var(--mds-static-white);
        font: var(--mds-text-body);
        cursor: pointer;
        box-shadow: var(--mds-shadow-container);
      }

      .demo-grid-status {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 3;
        padding: var(--mds-space-3xs);
        background: color-mix(in srgb, var(--mds-static-white) 80%, transparent);
        color: var(--mds-static-black);
        font: var(--mds-text-body-sm);
        box-shadow: var(--mds-shadow-container);
      }

      .mds-section {
        width: 100%;
      }

      .mds-section__container {
        padding-inline: var(--mds-breakpoint-horizontal-space-margin);
        max-width: 1280px;
        margin: 0 auto;
      }

      /* utility classes examples for spacing, paddings or margins? */
      .mds-space-3xl {
        padding-block: var(--mds-space-3xl);
      }

      .mds-space-2xl {
        padding-block: var(--mds-space-2xl);
      }

      .mds-space-sm {
        padding-block: var(--mds-space-sm);
      }

      .demo-color-block {
        border-radius: var(--mds-radius-md);
      }

      .demo-color-block--xs {
        height: 28px;
      }

      .demo-color-block--lg {
        height: 200px;
      }

      .demo-color-block--neutral {
        background: var(--mds-background-adaptive-brand-neutral-low);
      }

      .demo-color-block--primary {
        background: var(--mds-background-adaptive-brand-primary-low);
      }

      .demo-color-block--secondary {
        background: var(--mds-background-adaptive-brand-secondary-low);
      }

      .demo-color-block--tertiary {
        background: var(--mds-background-adaptive-brand-tertiary-low);
      }

      .demo-color-block--light {
        background: var(--mds-static-white);
      }

      .demo-color-block--dark {
        background: var(--mds-static-black);
      }

      .demo-section--neutral {
        background: var(--mds-background-section-brand-neutral-lowest);
      }

      .demo-section--primary {
        background: var(--mds-background-section-brand-primary-lowest);
      }

      .demo-section--primary-inverse {
        background: var(--mds-background-section-brand-primary-highest);
        color: var(--mds-inverse);
      }

      .demo-section--secondary {
        background: var(--mds-background-section-brand-secondary-lowest);
      }

      .demo-section--header {
        background: var(--mds-background-section-brand-tertiary-lowest);
      }

      .demo-section--state-banner {
        background: var(--mds-static-black);
        padding-block: var(--mds-space-2xs);
      }

      .mds-footer {
        background: var(--mds-background-section-brand-neutral-highest);
      }

      .mds-footer__bottom {
        margin-top: var(--mds-space-xl);
        padding-top: var(--mds-space-lg);
      }

      /* grid exploration */
      .mds-grid {
        display: grid;
        grid-template-columns: repeat(var(--mds-breakpoint-horizontal-space-columns), minmax(0, 1fr));
        gap: var(--mds-breakpoint-horizontal-space-gutter);
        min-height: 100%;
      }

      .mds-grid-full {
        grid-column: 1 / -1;
      }

      .mds-grid-2-column {
        grid-column: span calc(var(--mds-breakpoint-horizontal-space-columns) / 2);
      }

      .mds-grid-3-column {
        grid-column: span calc(var(--mds-breakpoint-horizontal-space-columns) / 3);
      }

      .mds-grid-4-column {
        grid-column: span calc(var(--mds-breakpoint-horizontal-space-columns) / 4);
      }


    </style>
  </head>
  <body>
    <div class="demo-grid" data-demo-grid>
      <div class="demo-grid-status" data-grid-status>Breakpoint: loading</div>
      <button type="button" class="demo-grid-toggle" data-grid-toggle aria-pressed="true">Hide grid</button>
      <div class="demo-grid__overlay" aria-hidden="true">
        <div class="mds-grid mds-section__container">
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
          <div class="demo-grid-column"></div>
        </div>
      </div>

      <div class="demo-page__content">
        <header class="mds-section demo-section--state-banner">
          <div class="mds-section__container">
            <div class="demo-color-block demo-color-block--xs demo-color-block--light">
            </div>
          </div>
        </header>

        <section class="mds-section demo-section--primary-inverse">
          <div class="mds-section__container mds-space-2xl">
            <h1>Heading Level 1</h1>
          </div>
        </section>

        <section class="mds-section demo-section--primary">
          <div class="mds-section__container mds-space-sm">
            <h2>Heading level 2</h2>
            <h3>Heading level 3</h3>
            <b>Body text lg bold</b>
            <p>Body text lg</p>
            </div>
          </div>
        </section>

        <section class="mds-section demo-section--secondary mds-space-3xl">
          <div class="mds-section__container">
          <h2>Grid examples</h2>
          <b>Full width</b>
          <div class="mds-grid mds-space-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-full"></div>
          </div>
          <b>2 columns</b>
          <div class="mds-grid mds-space-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-2-column"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-2-column"></div>
          </div>
          <b>3 columns</b>
          <div class="mds-grid mds-space-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-3-column"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-3-column"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-3-column"></div>
          </div>
          <b>4 columns</b>
          <div class="mds-grid mds-space-sm">
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-4-column"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-4-column"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-4-column"></div>
            <div class="demo-color-block demo-color-block--xs demo-color-block--dark mds-grid-4-column"></div>
          </div>
        </div>
        </section>

        <footer class="mds-footer">
          <div class="mds-section__container mds-space-3xl">
            <div class="demo-color-block demo-color-block--lg demo-color-block--neutral"></div>
          </div>
        </footer>
      </div>
    </div>
    <script>
      const gridDemo = document.querySelector("[data-demo-grid]");
      const toggleButton = document.querySelector("[data-grid-toggle]");
      const status = document.querySelector("[data-grid-status]");
      const breakpointQueries = [
        { label: "XS", query: window.matchMedia("(max-width: 320px)") },
        { label: "SM", query: window.matchMedia("(min-width: 321px) and (max-width: 480px)") },
        { label: "MD", query: window.matchMedia("(min-width: 481px) and (max-width: 768px)") },
        { label: "LG", query: window.matchMedia("(min-width: 769px) and (max-width: 1024px)") },
        { label: "XL", query: window.matchMedia("(min-width: 1025px) and (max-width: 1280px)") },
      ];

      function updateBreakpointStatus() {
        const activeBreakpoint = breakpointQueries.find(({ query }) => query.matches);
        const label = activeBreakpoint ? activeBreakpoint.label : "XL+";

        status.textContent = `Viewport: ${label} (${window.innerWidth}px)`;
      }

      toggleButton.addEventListener("click", () => {
        const isHidden = gridDemo.classList.toggle("demo-grid--overlay-hidden");
        toggleButton.textContent = isHidden ? "Show grid" : "Hide grid";
        toggleButton.setAttribute("aria-pressed", String(!isHidden));
      });

      breakpointQueries.forEach(({ query }) => {
        query.addEventListener("change", updateBreakpointStatus);
      });
      window.addEventListener("resize", updateBreakpointStatus);
      updateBreakpointStatus();
    </script>
  </body>
</html>
