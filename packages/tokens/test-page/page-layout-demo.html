<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDS Page Layout Demo</title>
    <link rel="stylesheet" href="../src/index.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      h1, h2, h3, h4, h5, h6 {
        color: var(--mds-text-and-icons-brand-neutral-default);
      }

      h1 {
        font: var(--mds-text-heading-2xl);
      }

      h2 {
        font: var(--mds-text-heading-xl);
      }

      h3 {
        font: var(--mds-text-heading-lg);
      }

      body {
        margin: 0;
        background: var(--mds-background-surface-default);
        color: var(--mds-text-and-icons-brand-neutral-default);
        font: var(--mds-text-body);
      }

      .mds-page-demo {
        position: relative;
        min-height: 100vh;
      }

      .mds-page-demo__overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      .mds-grid {
        display: grid;
        grid-template-columns: repeat(var(--mds-breakpoint-horizontal-space-columns), minmax(0, 1fr));
        gap: var(--mds-breakpoint-horizontal-space-gutter);
        min-height: 100%;
      }

      .mds-page-demo__overlay-column {
        min-height: 100%;
        background: pink;
        opacity: 0.3;
      }

      .mds-page-demo__content {
        position: relative;
        z-index: 1;
      }

      .mds-section {
        width: 100%;
      }

      .mds-section__container {
        padding-inline: var(--mds-breakpoint-horizontal-space-margin);
        max-width: 1280px;
        margin: 0 auto;
      }

      .mds-space-3xl {
        padding-block: var(--mds-space-3xl);
      }

      .mds-color-block {
        width: 100%;
        border-radius: var(--mds-radius-md);
      }

      .mds-color-block--xs {
        height: 28px;
      }

      .mds-color-block--lg {
        height: 200px;
      }

      .mds-color-block--neutral {
        background: var(--mds-background-adaptive-brand-neutral-low);
      }

      .mds-color-block--primary {
        background: var(--mds-background-adaptive-brand-primary-low);
      }

      .mds-color-block--secondary {
        background: var(--mds-background-adaptive-brand-secondary-low);
      }

      .mds-color-block--tertiary {
        background: var(--mds-background-adaptive-brand-tertiary-low);
      }

      .mds-color-block--light {
        background: var(--mds-static-white);
      }

      .mds-section--neutral {
        background: var(--mds-background-section-brand-neutral-lowest);
      }

      .mds-section--primary {
        background: var(--mds-background-section-brand-primary-lowest);
      }

      .mds-section--secondary {
        background: var(--mds-background-section-brand-secondary-lowest);
      }

      .mds-section--header {
        background: var(--mds-background-section-brand-tertiary-lowest);
      }

      .mds-section--state-banner {
        background: var(--mds-static-black);
        padding-block: var(--mds-space-2xs);
      }

      .mds-footer {
        background: var(--mds-background-section-brand-neutral-highest);
      }

      .mds-footer__bottom {
        margin-top: var(--mds-space-xl);
        padding-top: var(--mds-space-lg);
      }
    </style>
  </head>
  <body>
    <div class="mds-page-demo">
      <div class="mds-page-demo__overlay" aria-hidden="true">
        <div class="mds-grid mds-section__container">
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
          <div class="mds-page-demo__overlay-column"></div>
        </div>
      </div>

      <div class="mds-page-demo__content">
        <header class="mds-section mds-section--state-banner">
          <div class="mds-section__container">
            <div class="mds-color-block mds-color-block--xs mds-color-block--light">.mds-section__container</div>
          </div>
        </header>
        <section class="mds-section mds-section--neutral">
          <div class="mds-section__container mds-space-3xl">
            <h1>Heading Level 1</h1>
            <div class="mds-color-block mds-color-block--lg mds-color-block--light">.mds-section__container</div>
          </div>
        </section>

        <section class="mds-section mds-section--primary">
          <div class="mds-section__container mds-space-3xl">
            <h2>Heading Level 2</h2>
            <h3>Heading Level 3</h3>
            <div class="mds-color-block mds-color-block--lg mds-color-block--light">.mds-section__container</div>
          </div>
        </section>

        <section class="mds-section mds-section--secondary">
          <div class="mds-section__container mds-space-3xl">
            <div class="mds-color-block mds-color-block--lg mds-color-block--light">.mds-section__container</div>
          </div>
        </section>
        <footer class="mds-footer">
          <div class="mds-section__container mds-space-3xl">
            <div class="mds-color-block mds-color-block--lg mds-color-block--neutral">.mds-section__container</div>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
