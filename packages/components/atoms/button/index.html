<!DOCTYPE html>

<html
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
    <title>Content Styling Guide</title>
    <link type="text/css" rel="stylesheet" href="styles.css" media="all" />
</head>
<body>
<h1>Tokens test page</h1>
<div class="container">
<h2>Primary Buttons</h2>
  <button 
  type="button"
  class="mds-button fill large">Primary Button</button>

  <button 
  type="button"
  class="mds-button outline">Outline button</button>

  <button 
  type="button"
  class="mds-button ghost">Ghost button</button>

  <h2>Accent buttons</h2>
  <button 
  type="button"
  class="mds-button fill accent">Ghost button</button>

  <button 
  type="button"
  class="mds-button outline accent">Outline button</button>

  <button type="button"
  class="mds-button accent ghost">Ghost button</button>
</div>

</body>
</html>
