name: Deploy to AWS (stage)

# Builds the Storybook site and deploys it to the STAGE S3 origin behind
# CloudFront. Stage deploys are manual (workflow_dispatch) and run in the
# gated `stage` GitHub environment.
#
# Authenticates via GitHub OIDC; no long-lived AWS keys.
#
# Requires (stage environment): DEPLOY_ROLE_ARN (managed in github-iac),
# STAGE_BUCKET and STAGE_DISTRIBUTION_ID (set from `terraform output` of
# infra/env/stage after it is applied).
# Optional: GA_MEASUREMENT_ID from a separate staging GA4 property.
# GTM_CONTAINER_ID enables GTM instead; GTM_AUTH and GTM_PREVIEW select its staging environment.

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces --if-present
      
      - name: Build site
        env:
          STORYBOOK_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          STORYBOOK_GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}
          STORYBOOK_GTM_AUTH: ${{ vars.GTM_AUTH }}
          STORYBOOK_GTM_PREVIEW: ${{ vars.GTM_PREVIEW }}
        run: npm run build:storybook

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync storybook/storybook-static/ "s3://${{ vars.STAGE_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.STAGE_DISTRIBUTION_ID }}" \
            --paths "/*"
