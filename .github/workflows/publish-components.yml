name: Publish Components Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'components-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-components
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/components
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="components-v${PACKAGE_VERSION}"

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            echo "Expected tag: $EXPECTED_TAG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build components and workspace dependencies
        run: npm run build

      - name: Inspect package contents
        working-directory: packages/components
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/components
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          case "$PACKAGE_VERSION" in
            *-*)
              npm publish --provenance --access public --tag beta
              ;;
            *)
              npm publish --provenance --access public
              ;;
          esac
