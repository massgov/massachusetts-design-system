name: Lint Tokens Package

on:
  pull_request:
    paths:
      - ".github/workflows/lint-tokens.yml"
      - "packages/tokens/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lint-tokens.yml"
      - "packages/tokens/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
