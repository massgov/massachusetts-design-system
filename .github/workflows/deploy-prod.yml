name: Deploy to AWS (prod)

# Builds the Storybook site and deploys it to the PRODUCTION S3 origin behind
# CloudFront. Runs in the gated `prod` GitHub environment: it pauses for
# approval before anything runs, and the OIDC subject environment:prod is what
# the prod deploy role trusts.
#
# Prod never auto-deploys — it is triggered manually (workflow_dispatch) or by
# a release process. Authenticates via GitHub OIDC; no long-lived AWS keys.
#
# Requires (prod environment): DEPLOY_ROLE_ARN (managed in github-iac),
# PROD_BUCKET and PROD_DISTRIBUTION_ID (set from `terraform output` of
# infra/env/prod after it is applied).

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:storybook

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync storybook/storybook-static/ "s3://${{ vars.PROD_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.PROD_DISTRIBUTION_ID }}" \
            --paths "/*"
