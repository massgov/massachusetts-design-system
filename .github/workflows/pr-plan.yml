name: "Terraform PR Plan"

# Runs `terraform plan` as a required-style check on PRs that touch
# infrastructure, so reviewers see the planned AWS changes before merge.
# Plans every environment so a change to infra/env/prod is reviewed against
# prod (not just dev/stage). The plan role is read-only, so planning prod
# needs no gate.

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/plan.yml
      - .github/workflows/pr-plan.yml
      - .terraform-version

jobs:
  plan:
    name: "Terraform Plan"
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stage, prod]
    uses: ./.github/workflows/plan.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit
