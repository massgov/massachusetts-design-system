name: Lint Components Package

on:
  pull_request:
    paths:
      - ".github/workflows/lint-components.yml"
      - "packages/components/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lint-components.yml"
      - "packages/components/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint SCSS and Twig
        run: npm run lint --workspace @massds/mds-components
